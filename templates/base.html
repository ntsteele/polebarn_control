<!doctype html>
<html data-bs-theme="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ state.web.brand }} · {{ title if title else "Control" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/polebarn.css') }}" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-warning-subtle">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-warning" href="/">{{ state.web.brand }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 small">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/automation">Automation</a></li>
        <li class="nav-item"><a class="nav-link disabled" href="#">Mixer</a></li>
        <li class="nav-item"><a class="nav-link disabled" href="#">Lights</a></li>
        <li class="nav-item"><a class="nav-link disabled" href="#">Calibration</a></li>
        <li class="nav-item"><a class="nav-link" href="/config">Config</a></li>
        <li class="nav-item"><a class="nav-link" href="/diagnostics">Diagnostics</a></li>
        <li class="nav-item"><a class="nav-link" href="/asv/mix">ASV Mix</a></li>
        <li class="nav-item"><a class="nav-link" href="/playground">Playground</a></li>
      </ul>
      <span class="navbar-text text-secondary small">
        XR18 @ {{ state.xair.ip }}:{{ state.xair.port }}
      </span>
    </div>
  </div>
</nav>

<main class="container py-3">
  {% block content %}{% endblock %}
</main>

<!-- SocketIO Client -->
<script>
  const socket = io();
  socket.on('connect', () => console.log('[socket.io] Connected'));
  socket.on('ui_feedback', data => showToast(`✅ ${data.echo.action || 'UI Event'} OK`));

  function sendUI(action, value=null) {
    socket.emit('ui_action', { action, value });
  }

  function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast align-items-center text-bg-dark border-warning show position-fixed bottom-0 end-0 m-3';
    toast.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(), 2500);
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/client.js') }}"></script>
</body>
</html>
